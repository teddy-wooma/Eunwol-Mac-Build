name: Build and Release macOS Launcher

on:
  push:
    tags:
      - 'v*' # v1.1.0 같은 버전 태그가 푸시될 때만 작동

jobs:
  build:
    runs-on: macos-latest # 깃허브의 원격 macOS 컴퓨터 가동

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Application and Publish
        # 🚀 npx 명령어로 electron-builder를 직접 호출하면서 '--publish always' 옵션을 쐐기로 박아줍니다.
        run: npx electron-builder --mac --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # 깃허브 Secrets에 저장한 열쇠 연동