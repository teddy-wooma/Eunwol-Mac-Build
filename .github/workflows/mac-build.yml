name: Build and Release macOS Launcher

on:
  push:
    tags:
      - 'v*' # 🌟 내가 v1.0.7 같은 태그를 달아서 푸시할 때만 작동합니다.

jobs:
  build:
    runs-on: macos-latest # 🍏 깃허브의 원격 맥 컴퓨터를 빌립니다.

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 런처 구동에 적합한 노드 버전
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 소스코드 찌꺼기 없이 클린 설치

      - name: Build macOS Application
        run: npm run dist:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # 🔑 우리가 심어둔 열쇠를 자동 장착