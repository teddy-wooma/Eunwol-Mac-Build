name: Build and Release macOS Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Application (Compile Only)
        run: npx electron-builder --mac
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # 🌟 [치트키] 빌드된 맥용 .dmg 파일들을 깃허브 웹사이트에 바로 다운로드 가능한 파일로 제출합니다.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-launcher-files # 다운로드받을 압축파일 이름
          path: dist/*.dmg            # dist 폴더 안의 dmg 파일들을 수집
          retention-days: 7          # 파일은 일주일 동안 보관됩니다.