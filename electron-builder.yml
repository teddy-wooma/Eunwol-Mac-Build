appId: 'luna-eunwol-launcher'
productName: 'luna-eunwol-launcher'
artifactName: 'luna-eunwol-launcher-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi, Copyright © 2024 peunsu'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'luna-eunwol-launcher-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi, peunsu'
  vendor: 'Daniel Scalzi, peunsu'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'


publish:
  provider: github
  releaseType: draft  # 💡 안전하게 '임시 저장(Draft)' 상태로 먼저 업로드됩니다.