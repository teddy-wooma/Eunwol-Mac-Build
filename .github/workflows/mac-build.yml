name: Build and Release macOS Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Application (Compile Only)
        run: npx electron-builder --mac
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Force Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # 🌟 [교정] 빌드된 아티팩트 규격에 맞춰 dmg 확장자를 가진 모든 파일을 강제 수집합니다.
          files: |
            dist/*.dmg
          draft: true
          # 🌟 [교정] 빌드 엔진이 헷갈리지 않게 현재 내 저장소 주소로 명시합니다.
          repository: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}