name: Build and Release macOS Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # 릴리즈 작성을 위해 꼭 필요한 권한

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Application and Force Publish
        # 🚀 다른 거 안 거치고 빌드 엔진에게 무조건(--publish always) 올리라고 멱살 잡고 명령합니다.
        run: npx electron-builder --mac --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}